<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Formulário (ARRAY)</title> 
</head>
<body>
    <div class="container">
        <h1>Cadastro de Contratos</h1>
        <div class="form-group mt-3">
            <input type="text" class="form-control" name="nome" id="nome" placeholder="Digite seu nome completo">
        </div>
        <div class="form-group mt-3">
            <input type="text" class="form-control" name="telefone" id="telefone" placeholder="Digite seu número de telefone atualizado">
        </div>
        <div class="form-group mt-3">    
            <input type="text" class="form-control" name="cidade" id="cidade" placeholder="Digite o nome da cidade em que você mora">
        </div>
        <div class="form-group mt-3">    
            <input type="text" class="form-control" name="estado" id="estado" placeholder="Digite o nome do estado em que você vive">
        </div>    
        <button class="btn btn-outline-primary mt-3" onclick="cadastrar()">Cadastar</button>
        <h2>Contados Cadastros</h2>
        <ul id="lista"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
